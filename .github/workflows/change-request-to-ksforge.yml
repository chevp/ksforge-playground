name: Change Request to ksforge

on:
  push:
    branches: [main]
    paths:
      - '.ksforge/inbox/*.md'
  workflow_dispatch:
    inputs:
      change_request_markdown:
        description: 'Change Request als Markdown (# Titel, ## Beschreibung, ## Akzeptanzkriterien)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # `contents: write` alone is not enough to push a commit that adds or
  # modifies a `.github/workflows/*.yml` file — GitHub gates that
  # separately (confirmed against a real failure: "refusing to allow a
  # GitHub App to create or update workflow ... without `workflows`
  # permission") — and a playground repo is exactly the place a change
  # request plausibly asks for a new workflow (as happened here, for a
  # GitHub Pages deploy workflow).
  workflows: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.collect.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write manually pasted change request to inbox
        if: github.event_name == 'workflow_dispatch'
        id: manual
        env:
          CHANGE_REQUEST_MARKDOWN: ${{ inputs.change_request_markdown }}
        run: |
          mkdir -p .ksforge/inbox
          NAME="manual-change-request-${{ github.run_number }}.md"
          printf '%s\n' "$CHANGE_REQUEST_MARKDOWN" > ".ksforge/inbox/$NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ".ksforge/inbox/$NAME"
          git commit -m "chore: add $NAME to .ksforge/inbox [skip ci]"
          git push
          echo "file=.ksforge/inbox/$NAME" >> "$GITHUB_OUTPUT"

      - name: Collect changed inbox files
        id: collect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES="${{ steps.manual.outputs.file }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=$(git rev-list --max-parents=0 HEAD)
            fi
            FILES=$(git diff --name-only --diff-filter=ACM "$BEFORE" "${{ github.sha }}" -- '.ksforge/inbox/*.md')
          fi
          JSON=$(printf '%s\n' "$FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$JSON" >> "$GITHUB_OUTPUT"

  # ksforge (https://github.com/chevp/ksforge) owns turning each raw change
  # request into a numbered, managed record — it writes
  # .ksforge/change-requests/ (CR-<base62>.md + .json) itself. This workflow
  # only ever hands it plain markdown text; no local parsing, counters, or
  # generated JSON here.
  process:
    needs: detect
    if: needs.detect.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.detect.outputs.files) }}
      fail-fast: false
    steps:
      # Explicit `ref: main`, not the default (`github.sha`, frozen to the
      # commit that triggered this run): for a workflow_dispatch input,
      # `detect`'s own step above pushes the new inbox file as a *new*
      # commit on top of that trigger sha, so checking out `github.sha`
      # here would predate it and the file wouldn't exist yet.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      # Each job runs on its own fresh runner — `detect`'s own git-identity
      # config above does not carry over here, this is a separate checkout
      # on a separate machine. `ksforge --create-pull-request` needs one
      # too (it runs `git commit`), matching kscura's/ksforge's own
      # workflow.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read change request text
        id: change_request
        run: |
          {
            echo 'text<<KSFORGE_CHANGE_REQUEST_EOF'
            cat "${{ matrix.file }}"
            echo 'KSFORGE_CHANGE_REQUEST_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Process change request with ksforge
        uses: chevp/ksforge@main
        with:
          change-request: ${{ steps.change_request.outputs.text }}
          create-pull-request: "true"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
